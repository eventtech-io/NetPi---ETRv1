[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netpi-osc"
version = "0.1.0"
description = "NetPi Open Sound Control engine"
requires-python = ">=3.11"
dependencies = ["netpi-core", "pydantic>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["netpi_osc"]

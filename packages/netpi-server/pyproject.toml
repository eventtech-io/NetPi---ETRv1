[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "netpi-server"
version = "0.3.0"
description = "NetPi FastAPI web server and WebSocket hub"
requires-python = ">=3.11"
dependencies = [
    "netpi-core", "netpi-analyzer", "netpi-cabletester",
    "netpi-discovery", "netpi-tests", "netpi-dmx", "netpi-db", "netpi-osc", "netpi-oca",
    "fastapi>=0.110", "uvicorn[standard]>=0.29",
    "websockets>=12.0", "python-multipart>=0.0.9",
]
[project.scripts]
netpi-server = "netpi_server.main:main"
[tool.hatch.build.targets.wheel]
packages = ["netpi_server"]




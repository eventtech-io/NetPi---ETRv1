[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netpi-oca"
version = "0.1.0"
description = "NetPi OCA/AES70 discovery and control foundation"
requires-python = ">=3.11"
dependencies = ["netpi-core", "pydantic>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["netpi_oca"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "netpi-discovery"
version = "0.1.0"
description = "NetPi network discovery"
requires-python = ">=3.11"
dependencies = ["netpi-core", "netpi-analyzer", "scapy>=2.5", "icmplib>=3.0"]
[tool.hatch.build.targets.wheel]
packages = ["netpi_discovery"]

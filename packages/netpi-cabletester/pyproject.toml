[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "netpi-cabletester"
version = "0.1.0"
description = "NetPi cable testing backends"
requires-python = ">=3.11"
dependencies = ["netpi-core", "pydantic>=2.0"]
[tool.hatch.build.targets.wheel]
packages = ["netpi_cabletester"]

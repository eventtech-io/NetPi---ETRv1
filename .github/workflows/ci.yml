name: NetPi CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tcpdump tshark ethtool iperf3 speedtest-cli

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling
          # Install all netpi packages in dev mode
          for pkg in packages/netpi-core packages/netpi-analyzer packages/netpi-cabletester packages/netpi-discovery packages/netpi-dmx packages/netpi-tests packages/netpi-db packages/netpi-osc packages/netpi-oca packages/netpi-server; do
            pip install -e "$pkg"
          done
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=packages --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false



